<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myoko Days · resident review</title>
<style>body{margin:0;background:#ece8db;color:#35443a;font:14px system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font:24px Georgia;margin:0 auto 0 0}button,a{padding:8px 14px;border:1px solid #a3a58b;border-radius:4px;background:#f8f5ec;color:inherit;text-decoration:none;cursor:pointer}#stage{height:calc(100vh - 125px);min-height:420px}canvas{display:block;width:100%;height:100%}p{margin:12px 24px}</style>
<header><h1 id="title">Haneuma · model review</h1><button id="horse">Horse</button><button id="rabbit">Rabbit</button><button id="pause">Pause</button><button id="graze">Grazing pose</button><button id="save">Save render</button><a href="../#build">Full site</a></header><div id="stage"></div><p id="status">Loading…</p>
<script src="../js/vendor/three-r128.min.js"></script><script src="../assets/diorama/kit/kit.js"></script><script src="../assets/diorama/kit/grazers.js?v=21.1"></script>
<script>
(async()=>{const T=THREE,L=await fetch('../assets/diorama/data/layout.json').then(r=>r.json()),im=new Image();im.src='../assets/diorama/data/relief-height-lo.png';await im.decode();const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const cx=cv.getContext('2d');cx.drawImage(im,0,0);const data=cx.getImageData(0,0,cv.width,cv.height).data,W=cv.width,H=cv.height,SN=L.spanMetres.northSouth,SE=L.spanMetres.eastWest,E=L.exaggeration;
function heightAt(x,z){const r=Math.max(0,Math.min(H-1.001,(SN/2-x)/SN*H-.5)),c=Math.max(0,Math.min(W-1.001,(z+SE/2)/SE*W-.5)),i=Math.floor(r),j=Math.floor(c),fr=r-i,fc=c-j;const h=(r,c)=>(data[(r*W+c)*4]*256+data[(r*W+c)*4+1])/10-50;return(h(i,j)*(1-fc)+h(i,j+1)*fc)*(1-fr)+(h(i+1,j)*(1-fc)+h(i+1,j+1)*fc)*fr;}
const residents=MyokoGrazers.create({T,kit:MyokoKit.api,L,heightAt,EXAG:E}),scene=new T.Scene();scene.background=new T.Color(0xece8db);scene.add(residents.group);MyokoKit.lights().forEach(l=>scene.add(l));
let key='horse',paused=false,last=performance.now(),ground;const stage=document.getElementById('stage'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);const camera=new T.PerspectiveCamera(34,1,5,10000);
function select(name){key=name;document.getElementById('title').textContent=(key==='horse'?'Haneuma horse':'Madarao rabbit')+' · production model';if(ground){scene.remove(ground);ground.geometry.dispose();ground.material.dispose();}const a=residents.actors.find(a=>a.key===key),g=new T.PlaneGeometry(2600,2200,55,45);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)+a.home.x,z=p.getZ(i)+a.home.z;p.setXYZ(i,x,heightAt(x,z)*E,z);}g.computeVertexNormals();ground=new T.Mesh(g,new T.MeshLambertMaterial({color:0xb6be8c}));scene.add(ground);}
document.getElementById('horse').onclick=()=>select('horse');document.getElementById('rabbit').onclick=()=>select('rabbit');document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
document.getElementById('graze').onclick=()=>{const a=residents.actors.find(a=>a.key===key);a.time=key==='horse'?20:8;residents.update(0);paused=true;document.getElementById('pause').textContent='Resume';};
function draw(){const a=residents.actors.find(a=>a.key===key);residents.actors.forEach(b=>{b.rig.root.visible=b.key===key;b.shadow.visible=b.key===key;});const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const size=key==='horse'?1:.46;const yaw=a.rig.root.rotation.y;camera.position.set(a.x+(360*Math.cos(yaw)+1100*Math.sin(yaw))*size,a.rig.root.position.y+520*size,a.z+(-360*Math.sin(yaw)+1100*Math.cos(yaw))*size);camera.lookAt(a.x+30*size,a.rig.root.position.y+150*size,a.z);renderer.render(scene,camera);document.getElementById('status').textContent=a.state+' · articulated production mesh · actual heightfield';}
document.getElementById('save').onclick=()=>{draw();renderer.domElement.toBlob(async blob=>{const r=await fetch('/__capture/'+key,{method:'POST',body:blob});document.getElementById('status').textContent=r.ok?'Saved render to docs/images/'+key+'.png':'Capture is only available on the local review server.';});};
select('horse');function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)residents.update(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
})().catch(e=>document.getElementById('status').textContent=e.stack);
</script></html>
