<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myoko Days · model collection</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4e5c8;color:#2e3b35;font:14px Georgia}header{padding:20px 26px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #b7b394}h1{font-size:24px;font-weight:400;margin:0 auto 0 0}button,a{color:inherit;background:#fbf3e4;border:1px solid #a6aa83;border-radius:4px;padding:9px;cursor:pointer}#collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#b7b394}.card{background:#f5ead4;min-width:0;padding:18px 20px 16px}.card h2{font-size:21px;font-weight:400;margin:0 0 7px}.card p{font:13px system-ui;margin:4px 0;line-height:1.5}.stage{height:230px;width:100%}canvas,.stage img{width:100%;height:100%;display:block;object-fit:contain}footer{padding:16px 25px;font:12px system-ui}#status{margin:0}</style>
<header><h1>Four mountain residents</h1><button id="residents">Residents</button><button id="activities">Activities</button><a href="../#build">Explore the map</a></header><main id="collection"></main><footer><p id="status">Rendering production meshes…</p></footer>
<script src="../js/vendor/three-r128.min.js"></script><script src="../assets/diorama/kit/kit.js"></script><script src="../assets/diorama/kit/grazers.js"></script><script src="../assets/diorama/kit/critters.js"></script>
<script>
(async()=>{
const T=THREE,K=MyokoKit,L=await fetch('../assets/diorama/data/layout.json').then(r=>r.json());
const img=new Image();img.src='../assets/diorama/data/relief-height-lo.png';await img.decode();const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const cx=cv.getContext('2d');cx.drawImage(img,0,0);const d=cx.getImageData(0,0,cv.width,cv.height).data,W=cv.width,H=cv.height,SN=L.spanMetres.northSouth,SE=L.spanMetres.eastWest;
function heightAt(x,z){const r=Math.max(0,Math.min(H-1.001,(SN/2-x)/SN*H-.5)),c=Math.max(0,Math.min(W-1.001,(z+SE/2)/SE*W-.5)),i=Math.floor(r),j=Math.floor(c),fr=r-i,fc=c-j;const h=(a,b)=>(d[(a*W+b)*4]*256+d[(a*W+b)*4+1])/10-50;return(h(i,j)*(1-fc)+h(i,j+1)*fc)*(1-fr)+(h(i+1,j)*(1-fc)+h(i+1,j+1)*fc)*fr;}
const animals=MyokoCritters.create({T,kit:K.api,L,heightAt,EXAG:L.exaggeration});animals.update(0,3);for(let i=1;i<=180;i++)animals.update(i/30,3);animals.jump('fox','sit');animals.update(6.1,3);
const grazing=MyokoGrazers.create({T,kit:K.api,L,heightAt,EXAG:L.exaggeration});
const residents=[['Haneuma horse','haneuma-horse','Sasagamine · walking, grazing, listening and short canters'],['Madarao rabbit','madarao-rabbit','Madarao foothills · grazing, listening and grounded hops'],['Iizuna fox','iizuna-fox','Behind Iizuna · sniffing, sitting, pouncing and quick dashes'],['Kurohime snake','kurohime-snake','Kurohime foothills · continuous skin, slow travel and inspection pauses']];
const activities=[['imori','Imori-ike Pond','Boardwalk, reeds, lily pads and visitor centre'],['daruma','Daruma painting','Temple hall, gravel court and painting table'],['picnic','Sasagamine picnic','High meadow, cattle and birch trees'],['naena','Naena Falls','Cliff, falling water, pool and suspension bridge'],['soba','Soba making','Workshop with timber details'],['rice','Rice harvest','Paddies, working figures and drying racks'],['zip','Madarao zip line','Forest platforms, cables and riders'],['madarao','Madarao hike','Chairlift, pylons, hikers and summit path'],['forest','Forest therapy','Lake-side woodland clearing and walkers'],['ebike','Rice-field e-bike ride','Terraces, irrigation, farmhouse and rider'],['sup','Stand-up paddling','Paddleboard, rider and ripples'],['kayak','Lake kayaking','Two paddlers, red hull and wake'],['cruise','Cruise & island shrine','Torii, woodland shrine and sightseeing boat'],['winery','Winery & orchard','Vine rows, orchard and chapel'],['culture','Sekigawa checkpoint','River crossing, timber gate and travellers'],['sekiyama','Sekiyama Shrine','Shrine architecture and cedar setting'],['kiminoi','Kiminoi brewery','Kura, sugidama, noren and sake barrels'],['kanzuri','Kanzuri workshop','Chilli mats, tubs and working figure']];
await Promise.all(activities.map(([id])=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../assets/diorama/kit/attractions/'+id+'.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);})));let renderers=[];
function display(items,type){renderers.forEach(r=>r.dispose());renderers=[];const container=document.getElementById('collection');container.replaceChildren();container.style.gridTemplateColumns=type==='activities'?'repeat(4,minmax(0,1fr))':'repeat(2,minmax(0,1fr))';document.querySelector('h1').textContent=type==='residents'?'Four mountain residents':'Eighteen miniature destinations';
items.forEach(item=>{const [label,id,detail]=type==='residents'?item:[item[1],item[0],item[2]];const source=type==='residents'?(grazing.group.getObjectByName(id)||animals.group.getObjectByName(id)):K.build(id);if(!source)throw Error('Missing production mesh '+id);const object=source.clone(true);object.visible=true;if(type==='residents'&&id!=='kurohime-snake')object.rotation.y=0;object.updateMatrixWorld(true);const box=new T.Box3().setFromObject(object),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());object.position.sub(center);const scene=new T.Scene();scene.background=new T.Color(0xf5ead4);scene.add(object);K.lights().forEach(l=>scene.add(l));const card=document.createElement('section');card.className='card';const heading=document.createElement('h2');heading.textContent=label;if(type==='activities')heading.style.fontSize='16px';const stage=document.createElement('div');stage.className='stage';if(type==='activities')stage.style.height='125px';const desc=document.createElement('p');desc.textContent=detail;card.append(heading,stage,desc);container.append(card);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.append(renderer.domElement);renderers.push(renderer);const camera=new T.PerspectiveCamera(32,stage.clientWidth/stage.clientHeight,.1,100000),radius=Math.max(size.x,size.y,size.z)*1.6;camera.position.set(radius*.45,radius*.6,radius);camera.lookAt(0,0,0);renderer.render(scene,camera);const image=new Image();image.alt=label+' production model';image.src=renderer.domElement.toDataURL('image/png');stage.replaceChildren(image);renderer.dispose();renderer.forceContextLoss();});document.getElementById('status').textContent='Actual production geometry · enlarged inspection views · residents are subtle details in the full landscape';}
document.getElementById('residents').onclick=()=>display(residents,'residents');document.getElementById('activities').onclick=()=>display(activities,'activities');display(residents,'residents');
})().catch(e=>document.getElementById('status').textContent=e.stack);
</script></html>
